    <g>
      <rect x="40" y="70" width="360" height="470" rx="18" fill="#FFFFFF" fill-opacity="0.75" stroke="rgba(15,23,42,0.10)"/>
      <circle cx="66" cy="93" r="5" fill="#ef4444"/><circle cx="86" cy="93" r="5" fill="#eab308"/><circle cx="106" cy="93" r="5" fill="#22c55e"/>
      <text x="220" y="97" fill="#475569" font-size="12" text-anchor="middle" letter-spacing="1">~/infra_topology.ps1</text>
      <g clip-path="url(#asciiClip)">
        <g fill="url(#asciiGrad)" font-size="12.5" filter="url(#softGlow)" letter-spacing="0.5">
          <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="6s" repeatCount="indefinite"/>
          <g mask="url(#asciiReveal)">
            <text x="62" y="150" xml:space="preserve">         .--------.</text>
            <text x="62" y="167" xml:space="preserve">      .-(  AZURE   )-.</text>
            <text x="62" y="184" xml:space="preserve">     (    C L O U D    )</text>
            <text x="62" y="201" xml:space="preserve">      '-.__________.-'</text>
            <text x="62" y="218" xml:space="preserve">            ||</text>
            <text x="62" y="235" xml:space="preserve">     .------++------.</text>
            <text x="62" y="252" xml:space="preserve">     | [ ENTRA ID ] |</text>
            <text x="62" y="269" xml:space="preserve">     '------++------'</text>
            <text x="62" y="286" xml:space="preserve">       /    ||    \</text>
            <text x="62" y="303" xml:space="preserve">   [DC01] [AVD] [VM01]</text>
            <text x="62" y="320" xml:space="preserve">      \     |     /</text>
            <text x="62" y="337" xml:space="preserve">    .--o----o----o--.</text>
            <text x="62" y="354" xml:space="preserve">   (  M C P   B U S  )</text>
            <text x="62" y="371" xml:space="preserve">    '--o----o----o--'</text>
            <text x="62" y="388" xml:space="preserve">      /     |     \</text>
            <text x="62" y="405" xml:space="preserve">  [rmm]  [itglue] [n8n]</text>
            <text x="62" y="422" xml:space="preserve">      \     |     /</text>
            <text x="62" y="439" xml:space="preserve">       [ AI AGENT ]</text>
            <text x="62" y="456" xml:space="preserve">        01001101</text>
            <text x="62" y="473" xml:space="preserve">        &gt; agent.run()</text>
