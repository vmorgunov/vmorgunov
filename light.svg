y" values="0.3;0.7;0.3" dur="3.0s" repeatCount="indefinite"/></rect><text x="708" y="405">Graph API</text></g><g><rect x="761" y="388" width="75" height="26" rx="13" fill="url(#pillGrad)" stroke="#10B981" stroke-opacity="0.4"><animate attributeName="stroke-opacity" values="0.3;0.7;0.3" dur="3.2s" repeatCount="indefinite"/></rect><text x="798" y="405">Node.js</text></g><g><rect x="504" y="422" width="45" height="26" rx="13" fill="url(#pillGrad)" stroke="#22D3EE" stroke-opacity="0.4"><animate attributeName="stroke-opacity" values="0.3;0.7;0.3" dur="3.4s" repeatCount="indefinite"/></rect><text x="526" y="439">MCP</text></g><g><rect x="557" y="422" width="68" height="26" rx="13" fill="url(#pillGrad)" stroke="#7C3AED" stroke-opacity="0.4"><animate attributeName="stroke-opacity" values="0.3;0.7;0.3" dur="2.6s" repeatCount="indefinite"/></rect><text x="591" y="439">Claude</text></g><g><rect x="633" y="422" width="128" height="26" rx="13" fill="url(#pillGrad)" stroke="#10B981" stroke-opacity="0.4"><animate attributeName="stroke-opacity" values="0.3;0.7;0.3" dur="2.8s" repeatCount="indefinite"/></rect><text x="697" y="439">Copilot Studio</text></g><g><rect x="769" y="422" width="68" height="26" rx="13" fill="url(#pillGrad)" stroke="#22D3EE" stroke-opacity="0.4"><animate attributeName="stroke-opacity" values="0.3;0.7;0.3" dur="3.0s" repeatCount="indefinite"/></rect><text x="803" y="439">Docker</text></g><g><rect x="845" y="422" width="60" height="26" rx="13" fill="url(#pillGrad)" stroke="#7C3AED" stroke-opacity="0.4"><animate attributeName="stroke-opacity" values="0.3;0.7;0.3" dur="3.2s" repeatCount="indefinite"/></rect><text x="875" y="439">Linux</text></g>
        </g>
