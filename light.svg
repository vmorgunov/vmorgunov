<svg width="1180" height="610" viewBox="0 0 1180 610" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'SF Mono','JetBrains Mono','Fira Code',ui-monospace,monospace">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/><stop offset="50%" stop-color="#22D3EE"/><stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="asciiGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE"><animate attributeName="stop-color" values="#22D3EE;#7C3AED;#10B981;#22D3EE" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#7C3AED"><animate attributeName="stop-color" values="#7C3AED;#10B981;#22D3EE;#7C3AED" dur="8s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="pillGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.22"/><stop offset="100%" stop-color="#22D3EE" stop-opacity="0.22"/>
    </linearGradient>
    <radialGradient id="glowBlue"><stop offset="0%" stop-color="#2563EB" stop-opacity="0.22"/><stop offset="100%" stop-color="#2563EB" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowPurple"><stop offset="0%" stop-color="#7C3AED" stop-opacity="0.22"/><stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowEmerald"><stop offset="0%" stop-color="#10B981" stop-opacity="0.22"/><stop offset="100%" stop-color="#10B981" stop-opacity="0"/></radialGradient>
    <linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/><stop offset="50%" stop-color="#22D3EE" stop-opacity="0.9"/><stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigBlur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="45"/></filter>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.04"/></feComponentTransfer>
    </filter>
    <clipPath id="cardClip"><rect width="1180" height="610" rx="26"/></clipPath>
    <clipPath id="asciiClip"><rect x="40" y="120" width="360" height="400" rx="14"/></clipPath>
    <mask id="asciiReveal">
      <rect width="448" height="120" fill="#fff"><animate attributeName="height" values="120;120;520" keyTimes="0;0.12;1" dur="3.2s" fill="freeze"/></rect>
    </mask>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect width="1180" height="610" fill="#F8FAFC"/>
    <g filter="url(#bigBlur)">
      <circle r="150" fill="url(#glowPurple)"><animate attributeName="cx" values="180;320;180" dur="14s" repeatCount="indefinite"/><animate attributeName="cy" values="200;420;200" dur="14s" repeatCount="indefinite"/></circle>
      <circle r="170" fill="url(#glowBlue)"><animate attributeName="cx" values="900;720;900" dur="18s" repeatCount="indefinite"/><animate attributeName="cy" values="180;460;180" dur="18s" repeatCount="indefinite"/></circle>
      <circle r="140" fill="url(#glowEmerald)"><animate attributeName="cx" values="600;760;600" dur="16s" repeatCount="indefinite"/><animate attributeName="cy" values="520;300;520" dur="16s" repeatCount="indefinite"/></circle>
    </g>
    <rect width="1180" height="610" filter="url(#noise)" opacity="0.25"/>

