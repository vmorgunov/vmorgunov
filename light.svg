      <circle cx="496" cy="93" r="5" fill="#ef4444"/><circle cx="516" cy="93" r="5" fill="#eab308"/><circle cx="536" cy="93" r="5" fill="#22c55e"/>
      <text x="806" y="97" fill="#475569" font-size="12" text-anchor="middle" letter-spacing="1">vitalii — pwsh</text>

      <text x="504" y="158" fill="#0F172A" font-size="26" font-weight="700">Hi <tspan font-size="24">👋</tspan> I'm <tspan fill="url(#accent)">Vitalii Morgunov</tspan></text>

      <g font-size="17">
        <text x="504" y="192" fill="#475569">$ role:</text>
        <g>
          <text x="588" y="192" fill="#22D3EE"><tspan>IT Infrastructure Lead @ MSP</tspan><animate attributeName="opacity" values="1;1;0" keyTimes="0;0.9;1" dur="2.6s" begin="0s;15.600000000000001s" fill="freeze"/></text><text x="588" y="192" fill="#7C3AED" opacity="0"><tspan>Azure &amp; Hybrid Cloud Architect</tspan><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.04;0.9;1" dur="2.6s" begin="2.6s;18.2s" fill="freeze"/></text><text x="588" y="192" fill="#10B981" opacity="0"><tspan>AI Automation Engineer</tspan><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.04;0.9;1" dur="2.6s" begin="5.2s;20.8s" fill="freeze"/></text><text x="588" y="192" fill="#22D3EE" opacity="0"><tspan>MCP Server Builder</tspan><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.04;0.9;1" dur="2.6s" begin="7.8s;23.4s" fill="freeze"/></text><text x="588" y="192" fill="#7C3AED" opacity="0"><tspan>Identity &amp; Access (Entra ID)</tspan><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.04;0.9;1" dur="2.6s" begin="10.4s;26.0s" fill="freeze"/></text><text x="588" y="192" fill="#10B981" opacity="0"><tspan>Systems Thinker</tspan><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.04;0.9;1" dur="2.6s" begin="13.0s;28.6s" fill="freeze"/></text>
        </g>
      </g>

